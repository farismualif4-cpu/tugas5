<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f2f6ff;
}

.container{
    width:700px;
    margin:40px auto;
    background:#ffffff;
    padding:30px;
    border-radius:12px;
    box-shadow:0 5px 15px rgba(0,0,0,0.15);
}

h1{
    text-align:center;
    color:#f03800;
    margin-bottom:20px;
}

h2{
    color:#0a0909;
    margin-bottom:10px;
}

p{
    line-height:1.8;
    text-align:justify;
    margin-bottom:20px;
}

em{
    color:#1399ce;
    font-weight:bold;
}

audio{
    width:100%;
    margin-bottom:20px;
}

a{
    display:inline-block;
    text-decoration:none;
    background:#24ea66;
    color:white;
    padding:12px 20px;
    border-radius:8px;
    transition:0.3s;
}

a:hover{
    background:#16a64f;
}
  </style>
</head>
